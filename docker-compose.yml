services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: clinica-frontend:${APP_VERSION:-1.0.0}
    container_name: clinica_frontend
    ports:
      - "8091:8091"
    restart: unless-stopped
    networks:
      - dev1_network
networks:
  dev1_network:
    external: true